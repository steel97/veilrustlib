[package]
name = "veilrustffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
veilrustlib = { path = "../veilrustlib", features = ["rpc", "cache-redb"] }
tokio = { version = "1.41", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
once_cell = "1.20"
hex = "0.4"

[build-dependencies]
cbindgen = "0.27"
