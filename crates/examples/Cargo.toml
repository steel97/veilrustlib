[package]
name = "veilrustlib-examples"
description = "Runnable examples for veilrustlib, ported from the TypeScript wrapper's examples/"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
veilrustlib = { path = "../veilrustlib", features = ["rpc", "cache-redb"] }
tokio = { version = "1.44.2", features = ["macros", "rt-multi-thread", "time"] }

[[bin]]
name = "get-balance"
path = "src/bin/get_balance.rs"

[[bin]]
name = "tx"
path = "src/bin/tx.rs"

[[bin]]
name = "cached-balance"
path = "src/bin/cached_balance.rs"
