[package]
name = "veilrustlib-examples"
description = "Runnable examples for veilrustlib"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
veilrustlib = { path = "../veilrustlib", features = ["rpc", "cache-redb"] }
# "signal" lets veilfaucet shut its Discord shard down cleanly on Ctrl-C.
tokio = { version = "1.44.2", features = ["macros", "rt-multi-thread", "signal", "time"] }

# veilfaucet only. Kept out of the other examples' build by nothing more than
# not being used there; Cargo compiles a dependency once per workspace.
#
# serenity is the Discord client
# Default features are off to skip the voice stack, which a faucet never needs.
serenity = { version = "0.12.5", default-features = false, features = [
  "builder",
  "cache",
  "client",
  "collector",
  "gateway",
  "http",
  "model",
  "rustls_backend",
  "utils",
] }
# turso is a pure-Rust SQLite engine, so db.sqlite stays byte-compatible with
# the Dart bot's file without a C toolchain or bundled libsqlite3.
turso = { version = "0.7.2", default-features = false }

[[bin]]
name = "get-balance"
path = "src/bin/get_balance.rs"

[[bin]]
name = "tx"
path = "src/bin/tx.rs"

[[bin]]
name = "cached-balance"
path = "src/bin/cached_balance.rs"

[[bin]]
name = "veilfaucet"
path = "src/bin/veilfaucet/main.rs"
