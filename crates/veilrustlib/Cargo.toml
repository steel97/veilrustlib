[package]
name = "veilrustlib"
description = "Rust library for Veil blockchain - transaction builder, wallet management, and RPC client"
keywords = ["veil", "blockchain", "ringct", "privacy", "stealth-addresses"]
categories = ["cryptography::cryptocurrencies"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
veil-crypto = "1.3.0"
hex = "0.4.3"
sha2 = "0.10.9"
hmac = "0.12.1"
ripemd = "0.1.3"
rand = "0.8.5"
thiserror = "1.0.69"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
reqwest = { version = "0.12.15", default-features = false, features = [
    "json",
    "rustls-tls",
], optional = true }
base64 = { version = "0.22.1", optional = true }
tokio = { version = "1.44.2", features = ["time"], optional = true }

[dev-dependencies]
tokio = { version = "1.44.2", features = ["macros", "rt-multi-thread"] }

[features]
default = ["rpc"]
rpc = ["reqwest", "base64", "tokio"]
